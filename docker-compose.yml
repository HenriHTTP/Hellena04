services:
  bedrock:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bedrock-server
    restart: unless-stopped
    ports:
      - "19132:19132/udp"   # Porta do jogo Bedrock
      - "${RCON_PORT}:${RCON_PORT}/tcp"   # Porta RCON
    environment:
      EULA: TRUE  # Simplificado, sem aspas
      SERVER_NAME: "${SERVER_NAME}"
      GAMEMODE: "survival"
      DIFFICULTY: "normal"
      MAX_PLAYERS: "${MAX_PLAYERS}"
      RCON_ENABLE: "true"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      RCON_PORT: "${RCON_PORT}"
      TZ: "${TZ}"
    volumes:
      - ./data:/data
      - ./bedrock_addons:/data/addons  # Addons sincronizados

  bedrock-panel:
    image: itzg/rcon:latest
    container_name: bedrock-panel
    restart: unless-stopped
    ports:
      - "4326:4326"  # Porta do painel web
    environment:
      RWA_USERNAME: "admin"
      RWA_PASSWORD: "${RWA_PASSWORD}"
      RWA_ADMIN: "TRUE"
      RWA_RCON_HOST: "bedrock"
      RWA_RCON_PORT: "${RCON_PORT}"
      RWA_RCON_PASSWORD: "${RCON_PASSWORD}"
      RWA_SERVER_NAME: "${SERVER_NAME}"