services:
  # SERVIÇO 1: Servidor Minecraft Bedrock
  bedrock:
    image: bedrock-server:${IMAGE_TAG}  # Use a imagem buildada; ajuste se pushada para registry
    # Publica a porta do Jogo (UDP 19132) e a porta RCON (TCP 25575)
    ports:
      - "19132:19132/udp"
      - "${RCON_PORT}:${RCON_PORT}/tcp" # 25575:25575/tcp
    environment:
      # Variáveis lidas do arquivo .env
      EULA: "${EULA}"
      SERVER_NAME: "${SERVER_NAME}"
      GAMEMODE: "${GAMEMODE}"
      DIFFICULTY: "${DIFFICULTY}"
      MAX_PLAYERS: "${MAX_PLAYERS}"
      # Habilita e configura o RCON no servidor Minecraft
      RCON_ENABLE: "true"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      RCON_PORT: "${RCON_PORT}"
      TZ: "${TZ}"
    volumes:
      - ./data:/data # Armazena dados do mundo e configs em uma pasta local
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure  # Corrigido: substitui 'unless-stopped'

  # SERVIÇO 2: Painel Web RCON (Frontend de administração)
  bedrock-panel:
    image: itzg/rcon:latest
    # Publica a porta de acesso ao painel web (TCP 4326)
    ports:
      - "4326:4326"
    environment:
      # Credenciais para fazer login no painel web
      RWA_USERNAME: "admin"
      RWA_PASSWORD: "${RWA_PASSWORD}"
      RWA_ADMIN: "TRUE"
      # Conecta-se ao serviço 'bedrock' (nome do serviço no Swarm)
      RWA_RCON_HOST: "bedrock"
      RWA_RCON_PORT: "${RCON_PORT}"
      RWA_RCON_PASSWORD: "${RCON_PASSWORD}"
      RWA_SERVER_NAME: "${SERVER_NAME}"
    # Garante que o painel só inicie depois que o servidor estiver rodando
    depends_on:
      - bedrock
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure  # Corrigido: substitui 'unless-stopped'