services:
  bedrock:
    build: .
    container_name: bedrock-server
    restart: unless-stopped
    ports:
      - "19132:19132/udp"   # porta do jogo
      - "${RCON_PORT}:${RCON_PORT}/tcp"   # porta RCON
    environment:
      EULA: "TRUE"
      SERVER_NAME: "${SERVER_NAME}"
      GAMEMODE: "survival"
      DIFFICULTY: "normal"
      MAX_PLAYERS: "${MAX_PLAYERS}"
      RCON_ENABLE: "true"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      RCON_PORT: "${RCON_PORT}"
      TZ: "${TZ}"
    volumes:
      - ./data:/data
      - ./bedrock_addons:/data/addons  # Addons persistem via volume

  bedrock-panel:
    image: itzg/rcon:latest  # Imagem correta!
    container_name: bedrock-panel
    restart: unless-stopped
    ports:
      - "4326:4326"  # UI web do rcon-web-admin
      # Opcional: - "4327:4327"  # WebSocket para chat
    environment:
      RWA_USERNAME: "admin"  # Usuário para login no painel
      RWA_PASSWORD: "sua-senha-segura-aqui"  # Senha para o painel (adicione ao .env!)
      RWA_ADMIN: "TRUE"  # Modo admin
      RWA_RCON_HOST: "bedrock"  # Nome do serviço do servidor
      RWA_RCON_PORT: "${RCON_PORT}"
      RWA_RCON_PASSWORD: "${RCON_PASSWORD}"
      RWA_SERVER_NAME: "${SERVER_NAME}"
      # Opcional: RWA_PORT=4326  # Porta interna do painel